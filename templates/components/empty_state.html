{% load ui %}
<div class="flex flex-col items-center justify-center px-6 py-14 text-center">
  <span class="grid size-12 grid-cols-1 place-items-center rounded-xl border border-slate-200 bg-surface text-slate-400 shadow-xs">{% icon icon|default:"info" "size-5" %}</span>
  <p class="mt-4 text-sm font-semibold text-slate-900">{{ title }}</p>
  {% if text %}<p class="mt-1 max-w-sm text-sm text-slate-500">{{ text }}</p>{% endif %}
</div>
