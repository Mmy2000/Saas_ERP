{% load i18n ui %}{# Appearance menu: theme and accent colour, saved per user (static/core/js/appearance.js). #}
<div class="relative" data-appearance>
  <button type="button" class="btn btn-ghost h-8 px-2" aria-haspopup="true" aria-expanded="false" data-appearance-toggle
          title="{% translate 'Appearance' %}" aria-label="{% translate 'Appearance' %}">{% icon "palette" "size-[18px]" %}</button>
  <div class="menu-panel w-72" data-appearance-panel hidden>
    <p class="menu-label">{% translate "Theme" %}</p>
    <div class="segmented mt-2 grid w-full grid-cols-3 text-xs" role="group" aria-label="{% translate 'Theme' %}">
      <button type="button" class="segment flex items-center justify-center gap-1.5 px-2{% if ui.theme == 'light' %} segment-active{% endif %}" data-theme-choice="light" aria-pressed="{% if ui.theme == 'light' %}true{% else %}false{% endif %}">{% icon "sun" "size-3.5" %}{% translate "Light" %}</button>
      <button type="button" class="segment flex items-center justify-center gap-1.5 px-2{% if ui.theme == 'dark' %} segment-active{% endif %}" data-theme-choice="dark" aria-pressed="{% if ui.theme == 'dark' %}true{% else %}false{% endif %}">{% icon "moon" "size-3.5" %}{% translate "Dark" %}</button>
      <button type="button" class="segment flex items-center justify-center gap-1.5 px-2{% if ui.theme == 'system' %} segment-active{% endif %}" data-theme-choice="system" aria-pressed="{% if ui.theme == 'system' %}true{% else %}false{% endif %}">{% icon "monitor" "size-3.5" %}{% translate "System" %}</button>
    </div>

    <p class="menu-label mt-5">{% translate "Accent colour" %}</p>
    <div class="mt-2 grid grid-cols-4 gap-1" role="group" aria-label="{% translate 'Accent colour' %}">
      {% for key, label, swatch in ui.accents %}
      <button type="button" class="swatch" data-accent-choice="{{ key }}" aria-pressed="{% if key == ui.accent %}true{% else %}false{% endif %}">
        <span class="swatch-dot" style="background-color: {{ swatch }}">{% icon "check" "size-4" %}</span>{{ label }}
      </button>
      {% endfor %}
    </div>
    {% if ui.workspace %}
    <button type="button" class="mt-3 flex w-full items-center justify-between rounded-lg px-1.5 py-1 text-xs text-slate-500 hover:bg-slate-100 hover:text-slate-900{% if not ui.chosen_accent %} hidden{% endif %}" data-accent-choice="">
      {% blocktranslate trimmed with name=ui.default_accent_label %}Use the workspace colour ({{ name }}){% endblocktranslate %}<span aria-hidden="true">↺</span>
    </button>
    {% endif %}
  </div>
</div>
