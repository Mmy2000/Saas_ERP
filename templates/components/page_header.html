{# include with title="…" subtitle="…"; actions go in the caller's block after this include. #}
<div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
  <div class="min-w-0">
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900 sm:text-[28px]">{{ title }}</h1>
    {% if subtitle %}<p class="mt-1.5 text-sm text-slate-500">{{ subtitle }}</p>{% endif %}
  </div>
  {% if actions_template %}<div class="flex shrink-0 items-center gap-2">{% include actions_template %}</div>{% endif %}
</div>
