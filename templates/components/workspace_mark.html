{# The client's logo, or its initial on an accent tile. with size="size-8" (classes), name=… #}
{% with label=name|default:brand.workspace_name %}{% if brand.workspace_logo %}<img src="{{ brand.workspace_logo }}" alt="{{ label }}" class="{{ size|default:'size-8' }} shrink-0 rounded-lg bg-surface object-contain ring-1 ring-slate-200/80">{% else %}<span class="grid {{ size|default:'size-8' }} shrink-0 place-items-center rounded-lg bg-gradient-to-br from-brand-400 to-brand-600 font-semibold text-on-brand shadow-xs ring-1 ring-black/5" aria-hidden="true">{{ label|slice:":1"|upper }}</span>{% endif %}{% endwith %}
