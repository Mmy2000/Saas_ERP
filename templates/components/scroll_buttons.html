{% load i18n ui %}{# Floating "back to top" / "go to the bottom" buttons (static/core/js/scroll.js). #}
<div class="pointer-events-none fixed end-4 bottom-16 z-30 flex flex-col items-center gap-2 sm:end-6" data-no-print>
  <button type="button" class="scroll-btn" data-scroll-to="top" data-visible="false" tabindex="-1" aria-hidden="true"
          aria-label="{% translate 'Back to top' %}" title="{% translate 'Back to top' %}">
    <svg class="pointer-events-none absolute inset-0 size-full -rotate-90" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18.5" fill="none" stroke-width="2" class="stroke-brand-500" stroke-linecap="round"
              pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" data-scroll-progress></circle>
    </svg>
    {% icon "arrow-up" "size-[18px]" %}
  </button>
  <button type="button" class="scroll-btn" data-scroll-to="bottom" data-visible="false" tabindex="-1" aria-hidden="true"
          aria-label="{% translate 'Go to the bottom' %}" title="{% translate 'Go to the bottom' %}">
    {% icon "arrow-down" "size-[18px]" %}
  </button>
</div>
