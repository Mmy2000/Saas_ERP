{% if status == "active" %}<span class="badge badge-success"><span class="badge-dot"></span>{{ label }}</span>{% elif status == "suspended" %}<span class="badge badge-warning"><span class="badge-dot"></span>{{ label }}</span>{% elif status == "archived" or status == "purged" %}<span class="badge badge-neutral"><span class="badge-dot"></span>{{ label }}</span>{% else %}<span class="badge badge-brand"><span class="badge-dot"></span>{{ label }}</span>{% endif %}
