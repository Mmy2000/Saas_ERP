{% extends "base.html" %}
{% load i18n %}
{% block body %}
<div class="grid grid-cols-1 min-h-full place-items-center px-6 py-24">
  <div class="text-center">
    <p class="text-sm font-semibold text-brand-600">{% block code %}{% endblock %}</p>
    <h1 class="mt-3 text-3xl font-semibold tracking-tight text-slate-900">{% block heading %}{% endblock %}</h1>
    <p class="mt-4 text-base text-slate-500">{% block text %}{% endblock %}</p>
    <div class="mt-8"><a href="/" class="btn btn-primary">{% translate "Back to the dashboard" %}</a></div>
  </div>
</div>
{% endblock %}
