# nginx in front of gunicorn (installed by deploy/install.sh as /etc/nginx/sites-available/gweb).
# Every shop is <slug>.@DOMAIN@ and the console is admin.@DOMAIN@: one server block, one wildcard
# certificate. Django decides which host is a shop and which is the console.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # Let's Encrypt's HTTP check, for a shop's own domain (docs/operations/deploy.md, "Custom
    # domains"). The platform's wildcard certificate is checked through Cloudflare DNS instead.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04's nginx is 1.24: http2 goes on the listen line ("http2 on;" is 1.25+).
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name .@DOMAIN@;

    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:gweb_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;  # uploads: logos, photos, fonts, Excel imports
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static files straight from disk. Names are not versioned yet (TD-22), so browsers check
    # back every hour instead of caching for weeks.
    location /static/ {
        alias @APP_DIR@/var/static/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    # Everything else, uploads (/media/) included: the app checks who may see each file.
    # Never serve MEDIA_ROOT from nginx.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_read_timeout 130s;  # gunicorn's timeout is 120 s
    }
}
