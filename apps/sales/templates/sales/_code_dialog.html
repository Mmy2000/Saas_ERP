{% load i18n ui %}{% comment %}
The dialog that asks for the code sent to the customer's phone (static/sales/js/code.js).
Include once on a page that posts sales (the sales screen, a reservation).
{% endcomment %}
<dialog data-code-dialog class="m-auto w-[calc(100%-2rem)] max-w-md rounded-2xl border border-slate-200 bg-surface p-0 text-start text-slate-800 shadow-pop backdrop:bg-black/40 backdrop:backdrop-blur-[2px]"
        aria-labelledby="code-dialog-title" data-request-url="{% url 'sale-code-request' %}"
        data-resend-url="{% url 'sale-code-resend' 0 %}" data-verify-url="{% url 'sale-code-verify' 0 %}"
        data-sent="{% translate 'A code was sent to {phone}.' %}" data-resent="{% translate 'A new code was sent.' %}">
  <form method="dialog" class="flex flex-col" novalidate>
    <div class="flex items-center gap-3 border-b border-slate-100 px-6 py-4">
      <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-brand-50 text-brand-600 ring-1 ring-brand-200/70">{% icon "shield-check" "size-[18px]" %}</span>
      <div class="min-w-0">
        <h2 id="code-dialog-title" class="text-base font-semibold text-slate-900">{% translate "The customer's code" %}</h2>
        <p class="text-xs text-slate-500" data-code-why></p>
      </div>
    </div>
    <div class="space-y-4 px-6 py-5">
      <p class="text-sm text-slate-600" data-code-status data-sending="{% translate 'Sending the code…' %}"></p>
      <div>
        <label class="form-label" for="sale-code">{% translate "Code" %}</label>
        <input id="sale-code" class="form-input num w-full text-center text-2xl tracking-[0.5em]" inputmode="numeric"
               autocomplete="one-time-code" maxlength="6" dir="ltr" data-code-input disabled>
        <p class="form-error" data-error-for="code"></p>
      </div>
      <p class="hidden rounded-lg border border-red-200 bg-red-50/70 px-3.5 py-3 text-sm text-red-700" data-code-error role="alert"></p>
      <button type="button" class="btn btn-ghost px-0 text-xs" data-code-resend disabled>{% icon "send" "size-4" %}{% translate "Send the code again" %}</button>
    </div>
    <div class="flex flex-wrap items-center justify-end gap-2 border-t border-slate-100 px-6 py-4">
      <button type="button" class="btn btn-ghost me-auto hidden text-amber-700" data-code-skip>{% translate "Sell without the code" %}</button>
      <button value="cancel" formnovalidate class="btn btn-secondary">{% translate "Cancel" %}</button>
      <button type="button" class="btn btn-primary" data-code-confirm disabled>{% icon "check" "size-4" %}{% translate "Confirm" %}</button>
    </div>
  </form>
</dialog>
