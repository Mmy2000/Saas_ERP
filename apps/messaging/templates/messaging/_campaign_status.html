{% if status == "running" %}<span class="badge badge-brand" data-campaign-badge>{{ label }}</span>{% elif status == "paused" %}<span class="badge badge-warning" data-campaign-badge>{{ label }}</span>{% elif status == "done" %}<span class="badge badge-success" data-campaign-badge>{{ label }}</span>{% else %}<span class="badge badge-neutral" data-campaign-badge>{{ label }}</span>{% endif %}
