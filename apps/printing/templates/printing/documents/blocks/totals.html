<div style="width:{{ p.width }}%;margin-inline-start:auto">{% for total in doc.totals %}<div class="bk-row" style="padding:4px 6px;{% if p.lines %}border-bottom:1px solid #e4e4e7;{% endif %}{% if total.strong %}font-weight:700;font-size:1.1em;{% if p.strong_bg %}background:{{ p.strong_bg }};border-radius:6px;{% endif %}{% if p.strong_color %}color:{{ p.strong_color }};{% endif %}{% endif %}"><span>{{ total.label }}</span><span class="num">{{ total.value }}</span></div>{% endfor %}</div>
